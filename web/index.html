<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DX Award Map</title>
<link rel="stylesheet" href="/web/app.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>DX Award Map</h1>
      <div class="sub" id="sub">Loading your log&hellip;</div>
    </div>
    <nav class="mainnav">
      <a href="#world" id="nav-world">World</a>
      <label class="countrypick"><span class="vh">Country</span>
        <select id="countrysel" aria-label="Country or award"></select>
      </label>
      <a href="#settings" id="nav-settings">Settings</a>
    </nav>
  </header>

  <div class="totals" id="totals"></div>

  <div class="filters" id="filters" role="group" aria-label="Filters">
    <div class="fg"><span class="lbl">Band</span><div class="seg" id="f-band"></div></div>
    <div class="fg" id="fg-award"><span class="lbl">Award</span><div class="seg" id="f-award"></div></div>
    <div class="fg"><span class="lbl">Count</span><div class="seg" id="f-status"></div></div>
    <div class="fg" id="fg-op"><span class="lbl">Operator</span><div class="seg" id="f-op"></div></div>
    <label class="chk" id="fg-sus"><input type="checkbox" id="f-sus"> Exclude suspect QSOs</label>
    <label class="chk" id="fg-del"><input type="checkbox" id="f-del"> Show deleted</label>
  </div>

  <nav class="tabs" id="tabs"></nav>
  <main id="view"></main>
</div>
<div id="tip" hidden></div>
<script src="/web/vendor/d3.min.js"></script>
<script src="/web/vendor/topojson-client.min.js"></script>
<script src="/web/app.js"></script>
</body>
</html>
